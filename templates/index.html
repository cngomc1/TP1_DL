<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIST DIGIT Recognition</title>
    <style>
        #canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="280" height="280"></canvas>
    <button id="clear-button">Clear</button>
    <button id="predict-button">Predict</button>
    <p id="prediction"></p>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const clearButton = document.getElementById('clear-button');
        const predictButton = document.getElementById('predict-button');
        const predictionText = document.getElementById('prediction');

        let drawing = false;

        canvas.addEventListener('mousedown',(e)=>{
            drawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });

        canvas.addEventListener('mousemove',(e)=>{
            if (drawing){
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.stroke();
            }
        });

        canvas.addEventListener('mouseup',(e)=>{
            drawing = false;
        });

        clearButton.addEventListener('click', () => {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            predictionText.textContent = '';
        });

        predictButton.addEventListener('click', () =>{
            // const imgData = canvas.toDataURL('image/png');
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const grayData = [];

            // Convert to grayscale 28x28
            const scale = canvas.width / 28;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 28;
            tempCanvas.height = 28;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(canvas, 0, 0, 28, 28);
            const resizedData = tempCtx.getImageData(0, 0, 28, 28);

            for (let i = 0; i < resizedData.data.length; i += 4) {
                const gray = resizedData.data[i] * 0.3 + resizedData.data[i+1] * 0.59 + resizedData.data[i+2] * 0.11;
                grayData.push(255 - gray); // invert to match MNIST white-on-black
            }

            fetch('/predict', {
                method: 'POST', 
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({image: grayData}),
            })
            .then(response => response.json())
            .then(data => {
                predictionText.textContent = `Predicted Digit: ${data.prediction}`;
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
